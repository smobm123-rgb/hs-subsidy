<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지방보조금 통합관리</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1d2433; --sub:#5b6577; --line:#dfe3ea; --pri:#1f5fbf; --pri-weak:#e8f0fc;
  --ok:#17803d; --ok-weak:#e6f4ea; --warn:#b26a00; --warn-weak:#fff4e0; --bad:#c62828; --bad-weak:#fdecea;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5}
a{color:var(--pri);text-decoration:none}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;color:var(--ink)}
button:hover{border-color:var(--pri);color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{filter:brightness(1.08);color:#fff}
button.danger{color:var(--bad)}
button.sm{padding:3px 8px;font-size:12px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:10px 24px;background:#16336b;color:#fff}
.top .brand{font-weight:700;font-size:16px}
.top .brand small{font-weight:400;opacity:.7;margin-left:6px;font-size:12px}
.top nav{display:flex;gap:4px}
.top nav a{color:#dbe6ff;padding:6px 12px;border-radius:6px;white-space:nowrap}
.top{flex-wrap:wrap}
.top nav a.on,.top nav a:hover{background:rgba(255,255,255,.15);color:#fff}
#saved{margin-left:auto;font-size:12px;opacity:.8}
main{max-width:1400px;margin:0 auto;padding:20px 24px 80px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.muted{color:var(--sub)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h2 .tag{font-size:11px;font-weight:400;color:var(--sub);background:#eef1f5;border-radius:4px;padding:2px 6px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:12px;color:var(--sub)}
.f>span i{color:var(--bad);font-style:normal;margin-left:2px}
.f.w2{grid-column:span 2}.f.w3{grid-column:span 3}.f.w4{grid-column:span 4}
input,select,textarea{font:inherit;border:1px solid #cfd5df;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-weak);border-color:var(--pri)}
input[type=number]{text-align:right}
input[readonly]{background:#f3f5f8}
textarea{resize:vertical;min-height:64px}
.chk{display:inline-flex;align-items:center;gap:4px;margin-right:14px;white-space:nowrap}
.chk input{width:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:middle}
table.t th{background:#f7f9fc;font-weight:600;color:#3b4456;font-size:12px;white-space:nowrap}
table.t td input,table.t td select{padding:4px 6px}
table.t tfoot td{font-weight:700;background:#fafbfd}
table.t .num{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.aside{position:sticky;top:66px}
.stepper{display:flex;gap:0;margin:14px 0 16px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper a{flex:1;padding:12px 14px;color:var(--sub);border-right:1px solid var(--line);display:flex;align-items:center;gap:10px}
.stepper a:last-child{border-right:0}
.stepper a .no{width:26px;height:26px;border-radius:50%;background:#e9edf3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.stepper a b{display:block;color:var(--ink);font-size:14px}
.stepper a small{font-size:11px}
.stepper a.done .no{background:var(--ok);color:#fff}
.stepper a.on{background:var(--pri-weak)}
.stepper a.on .no{background:var(--pri);color:#fff}
.docbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 14px;background:#fff;border:1px dashed #b9c6dc;border-radius:10px;margin-bottom:16px}
.docbar b{margin-right:6px;font-size:13px}
.docbar button{font-size:12px}
.sum h3{font-size:13px;margin:14px 0 6px;color:#3b4456}
.sum h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 8px;font-size:13px}
.kv dt{color:var(--sub)}
.kv dd{margin:0;font-weight:600;word-break:keep-all}
.big{font-size:22px;font-weight:700}
.checks{list-style:none;margin:0;padding:0;font-size:12.5px}
.checks li{display:flex;gap:6px;padding:5px 8px;border-radius:6px;margin-bottom:4px}
.checks li.ok{background:var(--ok-weak);color:var(--ok)}
.checks li.warn{background:var(--warn-weak);color:var(--warn)}
.checks li.bad{background:var(--bad-weak);color:var(--bad)}
.checks li b{flex:none}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eef1f5;color:var(--sub);white-space:nowrap}
.badge.s1{background:#eef1f5;color:#4a5568}.badge.s2{background:#e8f0fc;color:var(--pri)}.badge.s3{background:#fff4e0;color:var(--warn)}.badge.s4{background:#f1e8fc;color:#6b3fb5}.badge.s5{background:var(--ok-weak);color:var(--ok)}
.empty{padding:40px;text-align:center;color:var(--sub)}
.autofill{background:#f7faff;border:1px solid #d6e3f8}
.autofill .kv{grid-template-columns:110px 1fr 110px 1fr}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0}
.calcline{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dotted var(--line)}
.calcline.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px;font-weight:700;font-size:15px}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:1100px){.layout{grid-template-columns:1fr}.aside{position:static}.grid{grid-template-columns:repeat(2,1fr)}.f.w3,.f.w4{grid-column:span 2}.autofill .kv{grid-template-columns:96px 1fr}}

/* ===== 서식 출력 ===== */
#docview{position:fixed;inset:0;z-index:50;background:#7c828c;overflow:auto}
#docview[hidden]{display:none}
.doc-toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 20px;background:#2b3240;color:#fff}
.doc-toolbar button{white-space:nowrap}
.doc-toolbar #docTitle{max-width:280px}
.doc-toolbar .hint{color:#c9d2e3;margin:0}
#docbody{padding:24px 0 60px}
.sheet{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;color:#000;padding:16mm 15mm;box-shadow:0 2px 12px rgba(0,0,0,.3);font-family:"Batang","바탕","Malgun Gothic",serif;font-size:10.5pt;line-height:1.55;position:relative}
.sheet .formno{font-size:9.5pt;border:1px solid #000;display:inline-block;padding:1px 8px;margin-bottom:8px;font-family:"Malgun Gothic",sans-serif}
.sheet .dtitle{text-align:center;font-size:19pt;font-weight:700;letter-spacing:4px;margin:10px 0 18px}
.sheet .dsub{text-align:center;margin:-12px 0 16px}
.sheet h4{font-size:11.5pt;margin:14px 0 6px}
.sheet table.f2{width:100%;border-collapse:collapse;margin-bottom:8px;table-layout:fixed}
.sheet table.f2 th,.sheet table.f2 td{border:1px solid #000;padding:4px 6px;vertical-align:middle;word-break:keep-all;overflow-wrap:anywhere}
.sheet table.f2 th{background:#eef0f3;font-weight:600;text-align:center}
.sheet table.f2 td.c{text-align:center}.sheet table.f2 td.r{text-align:right}
.sheet table.f2 tr.tot td{font-weight:700;background:#f7f7f7}
.sheet .unit{text-align:right;font-size:9pt;margin:-2px 0 2px}
.sheet .sign{margin-top:22px;text-align:center;line-height:2.1}
.sheet .sign .r{text-align:right;padding-right:30px}
.sheet .to{font-size:15pt;font-weight:700;text-align:center;margin-top:18px;letter-spacing:6px}
.sheet .att{margin-top:18px;font-size:9.5pt;border-top:1px dashed #000;padding-top:8px}
.sheet .box{border:1px solid #000;padding:8px 10px;margin-bottom:8px}
.sheet .note{font-size:9pt;margin:4px 0}
.sheet ol,.sheet ul{margin:4px 0;padding-left:20px}
.sheet .pre{white-space:pre-wrap}
.sheet .draft-head{text-align:center;font-size:20pt;font-weight:700;letter-spacing:10px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
.sheet .ck{font-family:"Malgun Gothic",sans-serif}
/* 원본 PDF 서식 위 입력 */
.psheet{position:relative;width:595pt;height:841pt;margin:0 auto 24px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.3);overflow:hidden;color:#000;font-family:"Malgun Gothic","맑은 고딕",sans-serif}
.psheet .pbg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;user-select:none}
.pf{position:absolute;margin:0;padding:0;border:0;line-height:1.2;color:#0a1a4a;overflow:hidden;font-family:inherit;background:transparent}
.pf.sl{display:flex;align-items:center;white-space:nowrap}
.pf.sl.a-l{justify-content:flex-start}.pf.sl.a-c{justify-content:center}.pf.sl.a-r{justify-content:flex-end}
.pf.sl>span{display:inline-block;white-space:nowrap}
.pf.ml{display:flex;flex-direction:column;justify-content:center}
.pf.ml>span{display:block;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.pf.ml.a-c>span{text-align:center}.pf.ml.a-r>span{text-align:right}
.pf.b{font-weight:700}
.pf.mk{background:#fff}
input.pf,textarea.pf{background:rgba(255,226,100,.28);border-radius:2px;outline:none;resize:none;width:auto;min-width:0}
input.pf:hover,textarea.pf:hover{background:rgba(255,206,60,.4)}
input.pf:focus,textarea.pf:focus{background:#fff8d6;box-shadow:0 0 0 1px #e0a800}
textarea.pf{white-space:pre-wrap;line-height:1.25}
input.pf.pa,textarea.pf.pa{background:transparent;color:#123a8a}
input.pf.pa:hover,textarea.pf.pa:hover{background:rgba(31,95,191,.08)}
.pf.ovr{color:#b04a00!important;box-shadow:inset 0 -1px 0 #e08a3c}
input.pf.ps,textarea.pf.ps{background:rgba(255,226,100,.13)}
.pf.ck{display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;color:#0a1a4a;border-radius:2px}
.pf.ck.ps{background:rgba(255,226,100,.18)}.pf.ck:hover{background:rgba(255,206,60,.45)}
textarea.pf.box{background:rgba(120,190,255,.18);outline:1px dashed #6aa6e8;resize:both;overflow:hidden}
#docbody.boxmode .psheet{cursor:crosshair}
.doc-toolbar button.on{background:#ffd34d;color:#1d2433;border-color:#ffd34d}
/* 처음 화면 */
.home{max-width:920px;margin:30px auto}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.home-card{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;color:var(--ink);transition:.15s}
.home-card:hover{border-color:var(--pri);box-shadow:0 6px 20px rgba(31,95,191,.12);transform:translateY(-2px)}
.home-card .hc-ico{font-size:34px}.home-card b{font-size:20px}.home-card span{color:var(--sub)}
.home-card .hc-stat{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.home-card .hc-stat em{font-style:normal;font-size:22px;font-weight:700;color:var(--pri)}
@media (max-width:700px){.home-grid{grid-template-columns:1fr}}
/* 로그인·연결 화면 */
#gate{position:fixed;inset:0;z-index:80;background:rgba(22,51,107,.92);display:flex;align-items:center;justify-content:center;padding:16px}
#gate[hidden]{display:none}
.gate-box{background:#fff;border-radius:12px;padding:26px 28px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.gate-box h2{font-size:18px}
.gate-box.wide{max-width:980px;max-height:92vh;display:flex;flex-direction:column}
.imp-scroll{overflow:auto;flex:1;min-height:0;border:1px solid var(--line);border-radius:8px}
.gate-box.wide .imp{display:flex;flex-direction:column;min-height:0;max-height:calc(92vh - 52px)}
.autofill-flash{background:#e6f4ea!important;transition:background .3s}
.ocrbar{height:6px;background:#eef1f5;border-radius:3px;overflow:hidden}.ocrbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.imp-scroll th[colspan]{background:#eef3fb;color:var(--pri);font-size:13px}
.imp-scroll td{vertical-align:top}
.imp-scroll td input:not([type=checkbox]),.imp-scroll td textarea{width:100%}
tr.imp-diff td:nth-child(3){background:#fffbea}
/* 인쇄 PDF 안에 넣는 데이터(보이지 않음, PDF 불러오기용) */
.pdata{position:absolute;left:8pt;top:1pt;width:575pt;font:1px/1.1 monospace;color:#fff;word-break:break-all;pointer-events:none;user-select:none;z-index:0}
#who{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
#who button{padding:2px 8px;font-size:11px}
.of-note{font-family:"Malgun Gothic",sans-serif;font-size:9pt;color:#b00;border:1px solid #b00;padding:3px 8px;margin-bottom:8px;display:inline-block}
.doc-toolbar .seg{display:inline-flex;border:1px solid #556;border-radius:6px;overflow:hidden}
.doc-toolbar .seg button{border:0;border-radius:0;background:#3a4252;color:#cfd6e4}
.doc-toolbar .seg button.on{background:#fff;color:#1d2433;font-weight:700}
@media print{
  @page{size:A4;margin:0}
  .psheet{margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .psheet:last-child{page-break-after:auto;break-after:auto}
  input.pf,textarea.pf,.pf.ck{background:transparent!important;box-shadow:none!important;outline:none!important;color:#000!important;resize:none!important}
  .of-note{display:none}
  body{background:#fff}
  .top,main,.doc-toolbar{display:none!important}
  #docview{position:static;background:#fff;overflow:visible}
  #docbody{padding:0}
  .sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page;min-height:auto}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">지방보조금 통합관리<small>신청 · 결정 · 교부 · 정산 (2026 화성시 관리기준)</small></div>
  <nav id="nav">
    <a href="#/" data-nav="home">처음 화면</a>
    <a href="#/orgs" data-nav="orgs">단체 관리</a>
    <a href="#/projects" data-nav="projects">보조금 관리</a>
    <a href="#/settings" data-nav="settings">설정 · 백업</a>
  </nav>
  <span id="saved"></span>
  <span id="who"></span>
</header>
<div id="gate" hidden></div>
<main id="app"></main>
<div id="docview" hidden>
  <div class="doc-toolbar">
    <b id="docTitle"></b>
    <span class="seg"><button id="modePdf" onclick="setDocMode('pdf')">원본 서식(PDF)</button><button id="modeTable" onclick="setDocMode('table')">편집용 표 서식</button></span>
    <button id="boxBtn" data-act="boxMode" title="버튼을 누른 뒤 서식의 빈 곳을 클릭하면 그 자리에 글상자가 생깁니다">+ 글상자</button>
    <button data-act="pfReset" title="직접 고친 자동 계산 칸을 원래 계산값으로 되돌립니다">자동값으로 되돌리기</button>
    <span class="hint" id="docHint"></span>
    <span class="sp"></span>
    <button onclick="exportAs('docx')" title="한글(한컴오피스)·MS워드에서 열 수 있습니다. 표 서식으로 저장됩니다.">한글/워드 파일(.docx)</button>
    <button onclick="exportAs('xlsx')" title="표 서식으로 저장됩니다.">엑셀 파일(.xlsx)</button>
    <button class="pri" onclick="window.print()">인쇄 / PDF 저장</button>
    <button onclick="closeDoc()">닫기</button>
  </div>
  <div id="docbody"></div>
</div>

<script src="forms/slots.js"></script>
<script>
/* ================= 기본 유틸 ================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const N = v => Number(v) || 0;
const isBlank = v => v === '' || v === null || v === undefined;
const won = n => Math.round(N(n)).toLocaleString('ko-KR');
const chun = n => (N(n) / 1000).toLocaleString('ko-KR', {maximumFractionDigits: 1});
const mil = n => (N(n) / 1e6).toLocaleString('ko-KR', {maximumFractionDigits: 2});
const pct = (a, b) => N(b) ? (N(a) / N(b) * 100).toFixed(1).replace(/\.0$/, '') : '0';
const sum = (arr, k) => (arr || []).reduce((s, r) => s + N(typeof k === 'function' ? k(r) : r[k]), 0);
const clone = o => JSON.parse(JSON.stringify(o));
const ymd = t => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
function fd(d) { if (!d) return '20  .   .   .'; const [y, m, dd] = d.split('-'); return `${y}. ${+m}. ${+dd}.`; }
function fdk(d) { if (!d) return '20    년    월    일'; const [y, m, dd] = d.split('-'); return `${y}년 ${+m}월 ${+dd}일`; }
function addMonths(d, n) { if (!d) return ''; const t = new Date(d + 'T00:00:00'); t.setMonth(t.getMonth() + n); return ymd(t); }
function monthsBetween(a, b) { if (!a || !b) return ''; const x = new Date(a), y = new Date(b); return Math.max(1, (y.getFullYear() - x.getFullYear()) * 12 + y.getMonth() - x.getMonth() + 1); }
function korNum(n) {
  n = Math.floor(N(n)); if (!n) return '영';
  const d = '일이삼사오육칠팔구', su = ['', '십', '백', '천'], bu = ['', '만', '억', '조'];
  let s = '', g = 0;
  while (n > 0) {
    let part = n % 10000; n = Math.floor(n / 10000);
    if (part) { let ps = ''; for (let i = 0; i < 4; i++) { const dg = part % 10; part = Math.floor(part / 10); if (dg) ps = d[dg - 1] + su[i] + ps; } s = ps + bu[g] + s; }
    g++;
  }
  return s;
}
const korWon = n => `금${korNum(n)}원정(₩${won(n)})`;
function getP(o, path) { return path.split('.').reduce((a, k) => a == null ? undefined : a[k], o); }
function setP(o, path, v) { const ks = path.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k] ??= {}, o); t[last] = v; }
function fillDefaults(o, tpl) {
  for (const k in tpl) {
    if (o[k] === undefined) o[k] = clone(tpl[k]);
    else if (tpl[k] && typeof tpl[k] === 'object' && !Array.isArray(tpl[k]) && o[k] && typeof o[k] === 'object') fillDefaults(o[k], tpl[k]);
  }
  return o;
}

/* ================= 데이터 ================= */
const KEY = 'hs-subsidy-v1';

/* ================= 저장소: 이 PC(localStorage) 또는 Firebase 실시간 공유 =================
   persist(kind, obj, path) — 어떤 칸이 바뀌었는지 알려 주면
   · 이 PC 모드: 전체를 localStorage에 저장
   · 공유 모드 : 그 칸(배열 안이면 배열 전체)만 Firestore에 update → 다른 사용자 화면에 즉시 반영 */
const COLL = {org: 'orgs', project: 'projects', settings: 'settings'};
const SYNC = {on: false, fs: null, auth: null, user: null, role: '', queue: {}, timer: null, pending: false, unsub: []};
const cleanForFs = v => JSON.parse(JSON.stringify(v ?? null));
function fieldOf(path) { const segs = path.split('.'), i = segs.findIndex(s => /^\d+$/.test(s)); return (i === -1 ? segs : segs.slice(0, i)).join('.'); }
function isStored(kind, obj) { return kind === 'settings' ? true : (kind === 'org' ? DB.orgs : DB.projects).includes(obj); }
function persist(kind, obj, path) {
  if (!obj || !isStored(kind, obj)) return; // 등록 전 초안은 저장하지 않음
  if (!SYNC.on) { saveSoon(); return; }
  const f = fieldOf(path), k = `${COLL[kind]}/${obj.id}`;
  (SYNC.queue[k] ??= {})[f] = cleanForFs(getP(obj, f));
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flushQueue, 400);
  setSaved('저장 중…');
}
function flushQueue() {
  const q = SYNC.queue; SYNC.queue = {};
  Object.entries(q).forEach(([k, upd]) => {
    const [c, id] = k.split('/');
    SYNC.fs.collection(c).doc(id).update(upd).then(() => setSaved('실시간 저장됨 ' + new Date().toLocaleTimeString('ko-KR')))
      .catch(e => { setSaved('⚠ 저장 실패: ' + (e.code || e.message)); });
  });
}
function createDoc(kind, obj) {
  if (!SYNC.on) { save(); return Promise.resolve(); }
  return SYNC.fs.collection(COLL[kind]).doc(obj.id).set(cleanForFs(obj)).then(() => setSaved('실시간 저장됨')).catch(e => setSaved('⚠ 저장 실패: ' + (e.code || e.message)));
}
function removeDoc(kind, id) {
  if (!SYNC.on) { save(); return; }
  SYNC.fs.collection(COLL[kind]).doc(id).delete().catch(e => alert('삭제 실패: ' + (e.code || e.message)));
}
function setSaved(t) { $('#saved').textContent = t; }

/* ================= 금액 계산 ================= */
const dv = (r, k) => isBlank(r['adj_' + k]) ? N(r[k]) : N(r['adj_' + k]);
const A = {
  reqSub: p => sum(p.budget, 'subsidy'),
  reqSelf: p => sum(p.budget, 'self'),
  reqOther: p => sum(p.budget, 'other'),
  reqTotal: p => A.reqSub(p) + A.reqSelf(p) + A.reqOther(p),
  decSub: p => sum(p.budget, r => dv(r, 'subsidy')),
  decSelf: p => sum(p.budget, r => dv(r, 'self')),
  decOther: p => sum(p.budget, r => dv(r, 'other')),
  decTotal: p => A.decSub(p) + A.decSelf(p) + A.decOther(p),
  granted: p => sum(p.grant.rounds, 'amount'),
};
function settleCalc(p) {
  const s = p.settle;
  const granted = A.granted(p);
  const decSub = A.decSub(p), decTotal = A.decTotal(p);
  const ratio = decTotal ? decSub / decTotal : 1;               // 교부결정 시 보조금 비율
  const subExec = sum(s.exp.filter(e => e.kind !== '자부담'), 'amount');
  const selfExec = sum(s.exp.filter(e => e.kind === '자부담'), 'amount');
  const disallowed = Math.min(N(s.disallowed), subExec);
  const subOk = subExec - disallowed;
  const total = subOk + selfExec;
  const byRatio = Math.floor(total * ratio);
  const allowed = Math.max(0, Math.min(subOk, byRatio, granted)); // 보조금 확정액
  const remain = Math.max(0, granted - subExec);                  // 집행잔액
  const ratioCut = Math.max(0, subOk - Math.min(subOk, byRatio)); // 자부담 비율 감소에 따른 감액
  const over = Math.max(0, Math.min(subOk, byRatio) - granted);
  const interest = N(s.interest), revenue = s.revenueReturn ? N(s.revenue) : 0;
  const principal = Math.max(0, granted - allowed);
  return {
    granted, decSub, decTotal, ratio, subExec, selfExec, disallowed, subOk, total, allowed, remain, ratioCut, over,
    interest, revenue, principal, refund: principal + interest + revenue,
    planSelfRate: decTotal ? (1 - ratio) * 100 : 0, realSelfRate: total ? selfExec / total * 100 : 0,
  };
}
function approver(amount) {
  if (amount <= 1e8) return '과장급';
  if (amount <= 3e8) return '실·국·단장급';
  if (amount <= 5e8) return '부시장';
  return '시장';
}
function stageOf(p) {
  if (p.settle.closed) return [5, '정산완료'];
  if (p.settle.reportDate || p.settle.exp.length) return [4, '정산중'];
  if (A.granted(p) > 0) return [3, A.granted(p) >= A.decSub(p) ? '교부완료' : '교부중'];
  if (p.decision.date) return [2, '교부결정'];
  return [1, p.applyDate ? '신청접수' : '신청작성'];
}

function rootOf(el) { const r = el.closest('[data-root]'); return r ? CUR[r.dataset.root] : null; }
function kindOf(el) { const r = el.closest('[data-root]'); return r ? r.dataset.root : ''; }

document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.b) return;
  const root = rootOf(el); if (!root) return;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.type === 'radio') { if (!el.checked) return; v = el.value; }
  else if (el.dataset.n !== undefined) v = el.value === '' ? '' : Number(el.value);
  else v = el.value;
  setP(root, el.dataset.b, v);
  persist(kindOf(el), root, el.dataset.b);
  const cm = el.dataset.b.match(/^budget\.(\d+)\.(adj_)?calc$/);
  if (cm && kindOf(el) === 'project') autoAmount(root, +cm[1], !!cm[2]);
  refresh();
  if (el.dataset.rerender !== undefined) rerender();
});
/* 산출내역 → 금액 자동 계산
   "200,000원×1명×25회", "5,000원 * 70명", "강사 1명*25회*150,000원 = 3,750,000원", 여러 줄·'+'는 합산, '%'는 비율, '만원'은 ×10,000 */
function calcAmount(s) {
  let total = 0, found = false;
  for (const raw of String(s || '').split('\n')) {
    const left = raw.split('=')[0];
    for (const part of left.split('+')) {
      const segs = part.split(/[×xX*✕]/);
      if (segs.length < 2 && !/\d[\d,.]*\s*(만\s*)?원/.test(part)) continue;
      let prod = 1, ok = true;
      segs.forEach((seg, i) => {
        const nums = [...seg.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(만|천)?\s*(%|원|명|회|개|일|월|개월|식|부|매|인|건|시간|권|ea|EA|세트|박)?/g)];
        if (!nums.length) { ok = false; return; }
        const m = i === 0 ? nums[nums.length - 1] : nums[0]; // 첫 칸은 마지막 숫자(앞 설명의 숫자 무시), 나머지는 첫 숫자
        let v = parseFloat(m[1].replace(/,/g, ''));
        if (m[2] === '만') v *= 10000; else if (m[2] === '천' && m[3] === '원') v *= 1000;
        if (m[3] === '%') v /= 100;
        prod *= v;
      });
      if (ok && isFinite(prod)) { total += prod; found = true; }
    }
  }
  return found ? Math.round(total) : null;
}
function autoAmount(p, i, adj) {
  const r = p.budget[i], amt = calcAmount(adj ? r.adj_calc : r.calc); if (amt == null) return;
  const ks = ['subsidy', 'self', 'other'], cur = k => adj ? (isBlank(r['adj_' + k]) ? N(r[k]) : N(r['adj_' + k])) : N(r[k]);
  const nz = ks.filter(k => cur(k)), src = ks.filter(k => N(r[k]));
  let target = nz.length === 1 ? nz[0] : !nz.length ? (adj && src.length === 1 ? src[0] : 'subsidy') : null;
  if (!target) return; // 여러 재원에 나눠 적은 행은 그대로 두고 '산출액' 칸에 차이만 표시
  const key = (adj ? 'adj_' : '') + target;
  if (N(r[key]) === amt && !isBlank(r[key])) return;
  r[key] = amt; persist('project', p, `budget.${i}.${key}`);
  const inp = document.querySelector(`[data-b="budget.${i}.${key}"]`); if (inp && inp !== document.activeElement) { inp.value = amt; inp.classList.add('autofill-flash'); setTimeout(() => inp.classList.remove('autofill-flash'), 900); }
}

function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `지방보조금_백업_${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!d.orgs || !d.projects) throw 0;
      d.orgs.forEach(o => fillDefaults(o, ORG_TPL)); d.projects.forEach(p => fillDefaults(p, PROJECT_TPL));
      if (SYNC.on) { // 공유 모드: 파일의 단체·사업을 공유 저장소에 추가(같은 id는 덮어씀)
        if (!confirm(`백업 파일의 단체 ${d.orgs.length}곳, 사업 ${d.projects.length}건을 공유 데이터에 올릴까요? (같은 항목은 파일 내용으로 바뀝니다)`)) return;
        fbBulkUpload(d); return;
      }
      if (!confirm(`백업 파일(단체 ${d.orgs.length}곳, 사업 ${d.projects.length}건)로 현재 데이터를 바꿀까요?`)) return;
      DB = d; fillDefaults(DB.settings ??= {}, blankDB().settings);
      CUR.settings = DB.settings; save(); location.hash = '#/projects'; rerender();
    } catch (e) { alert('올바른 백업 파일이 아닙니다.'); }
  };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm('모든 단체·사업 데이터를 삭제합니다. 먼저 백업하셨나요?')) return;
  if (prompt('삭제하려면 "삭제"를 입력하세요.') !== '삭제') return;
  DB = blankDB(); CUR.settings = DB.settings; save(); location.hash = '#/projects'; rerender();
}

CALC.dueInfo = p => {

  const late = rd > due ? Math.floor((new Date(rd) - new Date(due)) / (1000 * 60 * 60 * 24 * 30.44)) : 0;
  let cut = '';
  if (late >= 12) cut = ' — 보조금 20% 초과 50% 이하 삭감 대상';
  else if (late >= 6) cut = ' — 보조금 10% 초과 20% 이하 삭감 대상';
  else if (late >= 3) cut = ' — 보조금 10% 이하 삭감 대상';
  return `<b>${fd(due)}</b> (사업 종료일로부터 2개월)${rd > due ? ` <b style="color:var(--bad)">· ${p.settle.reportDate ? '지연 제출' : '기한 경과'}${cut}</b>` : ''}`;
};
function itemSettle(p) {
  const s = p.settle;
  const items = p.budget.map(r => r.item || '(비목 미입력)');
  const extra = [...new Set(s.exp.map(e => e.item || '(비목 미입력)').filter(x => !items.includes(x)))];
  return [...items.map((it, i) => ({it, sub: dv(p.budget[i], 'subsidy'), self: dv(p.budget[i], 'self') + dv(p.budget[i], 'other'), r: p.budget[i]})), ...extra.map(it => ({it, sub: 0, self: 0}))]
    .reduce((acc, x) => { const f = acc.find(a => a.it === x.it); if (f) { f.sub += x.sub; f.self += x.self; } else acc.push({...x}); return acc; }, [])
    .map(x => {
      const es = s.exp.filter(e => (e.item || '(비목 미입력)') === x.it);
      return {...x, subUsed: sum(es.filter(e => e.kind !== '자부담'), 'amount'), selfUsed: sum(es.filter(e => e.kind === '자부담'), 'amount')};
    });
}

/* ---------- DOCX ---------- */
function downloadDocx() {
  const sheets = [...document.querySelectorAll('#docbody .sheet')]; if (!sheets.length) return;
  const PAGE_W = 11906 - 850 * 2; // A4 본문 폭(twip)
  const run = (text, o) => text.split('\n').map((t, i) => `${i ? '<w:r><w:br/></w:r>' : ''}<w:r><w:rPr>${o.bold ? '<w:b/>' : ''}<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/></w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`).join('');
  const jc = a => a === 'center' ? 'center' : (a === 'right' || a === 'end') ? 'right' : 'left';
  const sz = px => Math.max(14, Math.round(px * 0.75 * 2));
  const para = (text, o, after = 60) => `<w:p><w:pPr><w:spacing w:before="0" w:after="${after}" w:line="276" w:lineRule="auto"/><w:jc w:val="${jc(o.align)}"/></w:pPr>${run(text, o)}</w:p>`;
  function tableXml(table) {
    const rects = [...table.querySelectorAll('th,td')].map(c => c.getBoundingClientRect());
    const edges = edgesOf(rects), {rows, grid} = tableGrid(table, edges);
    const totalPx = edges[edges.length - 1] - edges[0], scale = PAGE_W / totalPx;
    const widths = edges.slice(1).map((x, i) => Math.max(60, Math.round((x - edges[i]) * scale)));
    let xml = `<w:tbl><w:tblPr><w:tblW w:w="${PAGE_W}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders>${['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('')}</w:tblBorders><w:tblCellMar><w:left w:w="70" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;

        const fill = info.head ? '<w:shd w:val="clear" w:color="auto" w:fill="EEF0F3"/>' : info.tot ? '<w:shd w:val="clear" w:color="auto" w:fill="F7F7F7"/>' : '';
        const cs = getComputedStyle(info.td);
        const body = info.r0 === r ? para(cellText(info.td), {align: cs.textAlign, bold: info.head || info.tot || parseInt(cs.fontWeight) >= 600, sz: sz(parseFloat(cs.fontSize))}, 0) : '<w:p/>';
        xml += `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span > 1 ? `<w:gridSpan w:val="${span}"/>` : ''}${vm}${fill}<w:vAlign w:val="${cs.verticalAlign === 'top' ? 'top' : 'center'}"/></w:tcPr>${body}</w:tc>`;
        c = info.c1;

  }

/* ---------- XLSX ---------- */
function downloadXlsx() {
  const sheets = [...document.querySelectorAll('#docbody .sheet')]; if (!sheets.length) return;
  const colName = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  const X = {plain: 0, cell: 1, head: 2, int: 3, title: 4, cellC: 5, dec: 6, bold: 7, cellB: 8, right: 9, center: 10, cellR: 11};
  const usedNames = new Set();

    const blocks = sheetBlocks(sh), sr = sh.getBoundingClientRect(), cs = getComputedStyle(sh);
    const left = sr.left + parseFloat(cs.paddingLeft), right = sr.right - parseFloat(cs.paddingRight);
    const tRects = blocks.filter(b => b.type === 'table').flatMap(b => [...b.el.querySelectorAll('th,td')].map(c => c.getBoundingClientRect()));

    for (const b of blocks) {
      if (b.type === 'p') {
        const s = b.px >= 20 ? X.title : b.align === 'center' ? X.center : (b.align === 'right' || b.align === 'end') ? X.right : b.bold ? X.bold : X.plain;
        put(r, 0, b.text, s); for (let c = 1; c < ncol; c++) put(r, c, null, s);
        rows[r].h = Math.max(b.h ? b.h * 0.75 : 0, b.text.split('\n').length * (b.px >= 20 ? 26 : 15));
        if (ncol > 1) merges.push(`A${r + 1}:${colName(ncol - 1)}${r + 1}`);
        r++; continue;
      }
      const {rows: trs, cells} = tableGrid(b.el, edges);
      for (const info of cells) {
        const text = cellText(info.td), al = getComputedStyle(info.td).textAlign;
        let v = text, s;
        if (info.head) s = X.head;
        else if (NUM.test(text.trim())) { v = Number(text.trim().replace(/,/g, '')); s = Number.isInteger(v) ? X.int : X.dec; }
        else s = info.tot ? X.cellB : al === 'center' ? X.cellC : (al === 'right' || al === 'end') ? X.cellR : X.cell;
        for (let rr = info.r0; rr < info.r1; rr++) for (let c = info.c0; c < info.c1; c++) put(r + rr, c, rr === info.r0 && c === info.c0 ? v : null, s);
        const span = [];
        for (let rr = info.r0; rr < info.r1; rr++) for (let c = info.c0; c < info.c1; c++) span.push(`${r + rr}:${c}`);
        if (span.some(k => merged.has(k))) continue; // 측정 오차로 겹치는 병합은 건너뜀 (엑셀 복구 오류 방지)
        span.forEach(k => merged.add(k));
        if (info.r1 - info.r0 > 1 || info.c1 - info.c0 > 1) merges.push(`${colName(info.c0)}${r + info.r0 + 1}:${colName(info.c1 - 1)}${r + info.r1}`);
      }
      trs.forEach((tr, i) => { (rows[r + i] ??= {cells: {}, h: null}).h = Math.max(15, tr.getBoundingClientRect().height * 0.75); });
      r += trs.length;
      rows[r] = {cells: {}, h: 6}; r++; // 표 사이 여백
    }

  gate(`<h2>지방보조금 통합관리 로그인</h2><p class="muted">관리자에게 등록받은 이메일과 비밀번호로 로그인하세요. 로그인한 사용자끼리 같은 데이터를 실시간으로 함께 씁니다.</p>
    <form onsubmit="fbDoLogin(event)"><label class="f"><span>이메일</span><input id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="f" style="margin-top:8px"><span>비밀번호</span><input id="lgPw" type="password" autocomplete="current-password" required></label>
    <p id="lgMsg" style="color:var(--bad);min-height:18px">${esc(msg || '')}</p>
    <div class="row"><button class="pri" type="submit">로그인</button><button type="button" onclick="fbReset()">비밀번호 재설정 메일</button><span class="sp"></span><button type="button" onclick="useLocal()">이 PC 저장 모드로 사용</button></div></form>`);
  setTimeout(() => $('#lgEmail')?.focus(), 50);
}
function fbDoLogin(e) {
  e.preventDefault(); $('#lgMsg').textContent = '로그인 중…';
  SYNC.auth.signInWithEmailAndPassword($('#lgEmail').value.trim(), $('#lgPw').value).catch(err => { $('#lgMsg').textContent = AUTH_MSG[err.code] || err.message; });
}
function fbReset() {
  const em = $('#lgEmail').value.trim(); if (!em) { $('#lgMsg').textContent = '이메일을 먼저 입력하세요.'; return; }
  SYNC.auth.sendPasswordResetEmail(em).then(() => { $('#lgMsg').textContent = '재설정 메일을 보냈습니다. 메일함을 확인하세요.'; }).catch(err => { $('#lgMsg').textContent = AUTH_MSG[err.code] || err.message; });
}
function fbSignOut() { SYNC.unsub.forEach(f => f()); SYNC.auth.signOut().then(() => location.reload()); }
async function fbSignedIn(u) {
  SYNC.user = u;
  const email = (u.email || '').toLowerCase();
  let mem = null;
  try { const d = await SYNC.fs.collection('members').doc(email).get(); mem = d.exists ? d.data() : null; } catch (e) { mem = null; }
  if (!mem) {
    gate(`<h2>사용 권한이 없습니다</h2><p><b>${esc(email)}</b> 계정은 아직 사용자로 등록되지 않았습니다. 관리자에게 등록을 요청하세요.</p><div class="row"><button onclick="fbSignOut()">다른 계정으로 로그인</button><button onclick="useLocal()">이 PC 저장 모드로 사용</button></div>`);
    return;
  }
  SYNC.role = mem.role || 'user'; SYNC.on = true;
  DB = {orgs: [], projects: [], settings: blankDB().settings};
  DB.settings.id = 'main'; CUR.settings = DB.settings;
  $('#who').innerHTML = `${esc(email)} <button class="sm" onclick="fbSignOut()">로그아웃</button>`;
  setSaved('실시간 연결됨');
  let ready = 0; const done = () => { if (++ready === 3) { gateHide(); route(); } };
  const sub = (kind, list) => SYNC.fs.collection(COLL[kind]).onSnapshot(snap => {
    let changed = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, arr = DB[list], cur = arr.find(x => x.id === id);
      if (ch.type === 'removed') { DB[list] = arr.filter(x => x.id !== id); changed = true; return; }
      if (ch.doc.metadata.hasPendingWrites && cur) return; // 내가 방금 보낸 변경
      const data = fillDefaults({...ch.doc.data(), id}, kind === 'org' ? ORG_TPL : PROJECT_TPL);
      if (cur) replaceInPlace(cur, data, `${COLL[kind]}/${id}`); else arr.push(data);
      changed = true;
    });
    if (snap.metadata.fromCache && !navigator.onLine) setSaved('⚠ 오프라인 — 연결되면 자동 저장');
    if (ready < 3) done(); else if (changed) remoteRender();
  }, err => gate(`<h2>데이터를 읽을 수 없습니다</h2><p>${esc(err.code || err.message)}</p><p class="muted">보안 규칙(firestore.rules)과 사용자 등록 상태를 확인하세요.</p><div class="row"><button onclick="fbSignOut()">로그아웃</button></div>`));
  SYNC.unsub.push(sub('org', 'orgs'), sub('project', 'projects'));
  SYNC.unsub.push(SYNC.fs.collection('settings').doc('main').onSnapshot(d => {
    if (d.exists) { if (!d.metadata.hasPendingWrites) replaceInPlace(DB.settings, fillDefaults({...d.data(), id: 'main'}, blankDB().settings), 'settings/main'); }
    else SYNC.fs.collection('settings').doc('main').set(cleanForFs(DB.settings)).catch(() => {});
    if (ready < 3) done(); else remoteRender();
  }));
}
function replaceInPlace(target, src, key) {
  Object.keys(target).forEach(k => delete target[k]); Object.assign(target, src);
  Object.entries(SYNC.queue[key] || {}).forEach(([f, v]) => setP(target, f, clone(v))); // 아직 보내지 않은 내 입력은 유지
}
/* 다른 사용자의 변경이 들어오면 화면을 다시 그림 — 입력 중이면 칸을 벗어날 때까지 미룸 */
const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && (a.closest('#app') || a.closest('#docbody')); };
function remoteRender() { if (typing()) { SYNC.pending = true; return; } SYNC.pending = false; refreshKeepDoc(); }
document.addEventListener('focusout', () => setTimeout(() => { if (SYNC.pending && !typing()) remoteRender(); }, 60));
setInterval(() => { if (SYNC.pending && !typing()) remoteRender(); }, 1500); // 포커스 이벤트를 놓친 경우 대비
function refreshKeepDoc() {
  const y = window.scrollY, doc = CUR_DOC && {...CUR_DOC}, dy = $('#docview').scrollTop;
  route(); window.scrollTo(0, y);
  if (doc && findP(CUR.project?.id || '')) { openDoc(doc.key, doc.arg); $('#docview').scrollTop = dy; }
}
async function loadMembers() {
  const box = $('#memberBox'); if (!box) return;
  try {
    const snap = await SYNC.fs.collection('members').get();
    const me = (SYNC.user.email || '').toLowerCase();
    box.innerHTML = `<table class="t"><thead><tr><th>이메일</th><th>권한</th><th></th></tr></thead><tbody>${snap.docs.map(d => `<tr><td>${esc(d.id)}</td><td>${d.data().role === 'admin' ? '관리자' : '사용자'}</td><td class="num">${d.id === me ? '<span class="muted">나</span>' : `<button class="sm danger" onclick="memberDel('${esc(d.id)}')">삭제</button>`}</td></tr>`).join('')}</tbody></table>`;
  } catch (e) { box.textContent = '사용자 목록을 불러오지 못했습니다: ' + (e.code || e.message); }
}
function memberAdd() {
  const em = $('#mEmail').value.trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(em)) { alert('이메일을 정확히 입력하세요.'); return; }
  SYNC.fs.collection('members').doc(em).set({role: $('#mRole').value, addedBy: SYNC.user.email, addedAt: today()}).then(loadMembers).catch(e => alert('추가 실패: ' + (e.code || e.message)));
}
function memberDel(em) { if (!confirm(`${em} 사용자의 권한을 삭제할까요?`)) return; SYNC.fs.collection('members').doc(em).delete().then(loadMembers).catch(e => alert('삭제 실패: ' + (e.code || e.message))); }
async function fbBulkUpload(d) {
  const items = [...d.orgs.map(o => ['orgs', o]), ...d.projects.map(p => ['projects', p])];
  try {
    for (let i = 0; i < items.length; i += 400) {
      const b = SYNC.fs.batch();
      items.slice(i, i + 400).forEach(([c, x]) => b.set(SYNC.fs.collection(c).doc(x.id), cleanForFs(x)));
      await b.commit();
    }
    alert(`단체 ${d.orgs.length}곳, 사업 ${d.projects.length}건을 공유 데이터에 올렸습니다.`);
  } catch (e) { alert('올리기 실패: ' + (e.code || e.message)); }
}
function uploadLocal() { const d = loadLocalOnly(); d.orgs.forEach(o => fillDefaults(o, ORG_TPL)); d.projects.forEach(p => fillDefaults(p, PROJECT_TPL)); if (confirm(`이 PC에 저장돼 있던 단체 ${d.orgs.length}곳, 사업 ${d.projects.length}건을 공유 데이터에 올릴까요?`)) fbBulkUpload(d); }
function boot() { if (fbConfig()) fbStart(); else route(); }
